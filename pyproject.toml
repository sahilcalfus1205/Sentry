[project]
name = "sentry-sec"
version = "0.1.0"
description = "Run Semgrep and Trivy on a local repository and normalize their findings."
authors = [
    { name = "sahilcalfus1205", email = "sahil.ranadive@calfus.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sentry-sec = "sentry_sec.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
